<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafés | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Caffè Camillo<small>Colombi · café com origem</small></a><nav class="nav-links"><a href="produtos.html">Cafés</a><a href="sobre.html">Nossa história</a><a href="clube.html">Camillo Club</a><a href="contato.html">Contato</a></nav><a class="cart-link" href="carrinho.html">Carrinho (<span data-cart-count>0</span>)</a></div></header><main class="section"><div class="container"><div class="kicker">Catálogo</div><h1 style="font:700 60px var(--serif);margin:8px 0">Encontre o café que combina com você.</h1><p class="muted">Organizado primeiro pela torra, depois por origem, tipo e essência.</p><div class="filters"><input class="input" id="search" placeholder="Buscar café..."><select class="select" id="roast"><option value="">Todas as torras</option><option value="torra-fraca">Torra fraca</option><option value="torra-media">Torra média</option><option value="torra-forte">Torra forte</option></select><select class="select" id="bean"><option value="">Todos os tipos</option><option value="arabica">Arábica</option><option value="conilon">Conilon</option><option value="mixed">Misto</option></select><select class="select" id="essence"><option value="">Todas as essências</option><option value="tradicional">Tradicional</option><option value="cacau">Cacau</option><option value="chocolate">Chocolate</option><option value="laranja">Laranja</option></select><select class="select" id="sort"><option value="">Recomendados</option><option value="price_asc">Menor preço</option><option value="price_desc">Maior preço</option><option value="name">Nome</option></select></div><div class="section-head"><strong id="count">Carregando...</strong><a href="produtos.html" class="btn btn-ghost">Limpar filtros</a></div><div class="product-grid" id="grid"></div></div></main><footer class="footer"><div class="container"><strong>Caffè Camillo Colombi</strong><p>Grazie por escolher café com origem.</p></div></footer><div class="toast" id="toast"></div><script src="js/app.js"></script><script>
const q=new URLSearchParams(location.search);for(const [k,id] of [['roast','roast'],['bean_type','bean'],['essence','essence']])if(q.get(k))document.querySelector('#'+id).value=q.get(k);let timer;async function load(){const params=new URLSearchParams();for(const [id,key] of [['search','search'],['roast','roast'],['bean','bean_type'],['essence','essence'],['sort','sort']]){const v=document.querySelector('#'+id).value;if(v)params.set(key,v)}const ps=await cc.api('/products?'+params);count.textContent=ps.length+' cafés encontrados';grid.innerHTML=ps.map(p=>{const sold=Number(p.stock||0)<=0;return `<a class="card product-card ${sold?'sold-out':''}" href="produto.html?id=${p.id}"><div class="product-image"><img src="${cc.esc(p.image_url)}" alt="${cc.esc(p.name)}" onerror="cc.imgFallback(this)"></div><div class="product-info"><span class="pill">${cc.esc(p.roast_name)}</span><h3>${cc.esc(p.name)}</h3><p class="muted">${cc.esc(p.origin_name)} · ${cc.esc(p.bean_type)}</p><p>${cc.esc(p.sensory_notes)}</p><div style="display:flex;justify-content:space-between;align-items:center"><strong class="price">A partir de ${cc.money(p.min_price)}</strong>${sold?'<span class="pill">Esgotado</span>':''}</div></div></a>`}).join('')||'<div class="empty">Nenhum café encontrado. Tente outro filtro.</div>'}['search','roast','bean','essence','sort'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(load,180)}));load();</script></body></html>
