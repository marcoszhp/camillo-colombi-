<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Caffè Camillo<small>Colombi</small></a></div></header><main class="section"><div class="container"><div class="kicker">Finalizar compra</div><h1 style="font:700 56px var(--serif)">Seu pedido, com calma.</h1><div class="checkout-grid"><form class="card form-card" id="form"><div class="form-grid"><label>Nome completo<input class="input full" name="customer_name" required></label><label>E-mail<input class="input full" name="customer_email" type="email" required></label><label>Telefone<input class="input full" name="customer_phone" required></label><label>Forma de recebimento<select class="select full" name="fulfillment" id="fulfillment"><option value="delivery">Entrega</option><option value="pickup">Retirada</option></select></label><label class="full">Endereço completo<textarea class="textarea" name="address_text" id="address" rows="3" required></textarea></label><label>Estado<select class="select" name="state" id="state"><option>MG</option><option>SP</option><option>RJ</option><option>ES</option><option>BA</option><option>PR</option><option>SC</option><option>RS</option></select></label><label>Pagamento<select class="select" name="payment_method"><option value="pix">Pix</option><option value="credit_card">Cartão de crédito (exceto Amex)</option></select></label><label class="full">Observações<textarea class="textarea" name="notes" rows="3"></textarea></label></div><div class="notice" style="margin:18px 0">No ambiente de demonstração, a confirmação do pagamento é simulada. O site não armazena número de cartão.</div><button class="btn btn-primary" style="width:100%">Criar pedido</button></form><aside class="card form-card summary"><h2 style="font:700 32px var(--serif)">Resumo</h2><div id="summary"></div></aside></div></div></main><div class="toast" id="toast"></div><script src="js/app.js"></script><script>if(!state.token)location.href="login.html";if(!state.cart.length)location.href='carrinho.html';const sub=state.cart.reduce((a,i)=>a+i.price*i.quantity,0);summary.innerHTML=state.cart.map(i=>`<p><strong>${i.quantity}×</strong> ${cc.esc(i.name)}<br><span class="muted">${cc.esc(i.variant_label)}</span> · ${cc.money(i.price*i.quantity)}</p>`).join('')+`<hr><p><strong>Subtotal: ${cc.money(sub)}</strong></p>`;fulfillment.onchange=()=>{address.required=fulfillment.value==='delivery';address.disabled=fulfillment.value==='pickup';state.disabled=fulfillment.value==='pickup'};form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);try{const data=await cc.api('/orders',{method:'POST',body:JSON.stringify({customer_name:f.get('customer_name'),customer_email:f.get('customer_email'),customer_phone:f.get('customer_phone'),fulfillment:f.get('fulfillment'),address_text:f.get('address_text'),state:f.get('state'),payment_method:f.get('payment_method'),notes:f.get('notes'),items:state.cart.map(i=>({variant_id:i.variant_id,quantity:i.quantity})),variant_labels:Object.fromEntries(state.cart.map(i=>[i.variant_id,i.variant_label]))})});await cc.api('/orders/'+data.id+'/confirm-payment',{method:'POST'});state.cart=[];cc.save();location.href='conta.html?order='+data.id}catch(err){cc.toast(err.message)}};</script></body></html>
