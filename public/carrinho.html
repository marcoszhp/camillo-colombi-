<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Caffè Camillo<small>Colombi</small></a><nav class="nav-links"><a href="produtos.html">Cafés</a><a href="clube.html">Camillo Club</a></nav></div></header><main class="section"><div class="container"><div class="kicker">Il tuo ordine</div><h1 style="font:700 56px var(--serif)">Seu carrinho.</h1><div id="cart"></div></div></main><div class="toast" id="toast"></div><script src="js/app.js"></script><script>function render(){if(!state.cart.length){cart.innerHTML='<div class="empty">Seu carrinho está vazio. <a href="produtos.html" style="color:var(--red);font-weight:900">Escolha um café.</a></div>';return}const sub=state.cart.reduce((a,i)=>a+i.price*i.quantity,0);cart.innerHTML=`<div class="checkout-grid"><div>${state.cart.map((i,n)=>`<article class="card" style="padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:10px"><img src="${cc.esc(i.image)}" style="width:100px;height:100px;object-fit:contain;background:#f4e8c7;border-radius:12px" onerror="cc.imgFallback(this)"><div style="flex:1"><strong>${cc.esc(i.name)}</strong><p class="muted">${cc.esc(i.variant_label)}</p><div class="actions"><button class="btn btn-ghost" onclick="change(${n},-1)">−</button><strong>${i.quantity}</strong><button class="btn btn-ghost" onclick="change(${n},1)">+</button><button class="btn btn-ghost" onclick="removeItem(${n})">Remover</button></div></div><strong>${cc.money(i.price*i.quantity)}</strong></article>`).join('')}</div><aside class="card form-card summary"><div class="section-head"><strong>Resumo</strong><strong class="price">${cc.money(sub)}</strong></div><p class="muted">Frete grátis no Sudeste e em compras acima de R$300.</p><a class="btn btn-primary" style="width:100%" href="checkout.html">Finalizar compra</a></aside></div>`}function change(n,d){state.cart[n].quantity=Math.max(1,Math.min(20,state.cart[n].quantity+d));cc.save();render()}function removeItem(n){state.cart.splice(n,1);cc.save();render()}render();</script></body></html>
