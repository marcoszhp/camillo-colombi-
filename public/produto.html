<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Caffè Camillo<small>Colombi · café com origem</small></a><nav class="nav-links"><a href="produtos.html">Cafés</a><a href="sobre.html">Nossa história</a><a href="clube.html">Camillo Club</a></nav><a class="cart-link" href="carrinho.html">Carrinho (<span data-cart-count>0</span>)</a></div></header><main class="product-detail"><div class="container" id="app"></div></main><footer class="footer"><div class="container">Caffè Camillo Colombi · Grazie.</div></footer><div class="toast" id="toast"></div><script src="js/app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return location.href='produtos.html';const p=await cc.api('/products/'+id);let variant=p.variants.find(v=>v.stock>0)||p.variants[0],weight=variant.weight_grams,grinding=variant.grinding_id;function price(){return p.variants.find(v=>v.weight_grams===weight&&v.grinding_id===grinding)}function render(){variant=price()||p.variants[0];app.innerHTML=`<div class="product-detail-grid"><div><div class="gallery-main"><img src="${cc.esc(p.image_url)}" alt="${cc.esc(p.name)}" onerror="cc.imgFallback(this)"></div><div class="detail-block"><h2>De onde vem?</h2><p>${cc.esc(p.origin_name)}</p><p class="muted">${cc.esc(p.origin_description)}</p><img src="${cc.esc(p.origin_image)}" alt="Origem do café" style="width:100%;max-height:340px;object-fit:cover;border-radius:16px" onerror="cc.imgFallback(this)"></div></div><div class="detail"><div class="kicker">${cc.esc(p.roast_name)}</div><h1>${cc.esc(p.name)}</h1><p>${cc.esc(p.description)}</p><p class="muted">${cc.esc(p.sensory_notes)}</p><div class="detail-block"><strong>Peso</strong><div class="variant-row" id="weights">${[250,500].map(w=>`<button class="choice ${w===weight?'active':''}" data-w="${w}">${w}g</button>`).join('')}</div></div><div class="detail-block"><strong>Moagem</strong><div class="variant-row" id="grinds">${[...new Map(p.variants.map(v=>[v.grinding_id,v])).values()].map(v=>`<button class="choice ${v.grinding_id===grinding?'active':''}" data-g="${v.grinding_id}">${cc.esc(v.grinding_name)}</button>`).join('')}</div></div><div class="detail-block"><div style="display:flex;justify-content:space-between;align-items:center"><strong class="price">${cc.money(variant.price)}</strong>${variant.stock>0?`<span class="pill">${variant.stock} em estoque</span>`:'<span class="pill">Esgotado</span>'}</div><div class="actions"><button class="btn btn-primary" id="buy" ${variant.stock<1?'disabled':''}>Adicionar ao carrinho</button>${variant.stock<1?'<button class="btn btn-secondary" id="notify">Me avise</button>':''}</div></div><div class="detail-block"><h2>História e origem</h2><p>${cc.esc(p.story)}</p></div><div class="detail-block"><h2>Do grão à xícara</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div><b>01</b><br>Seleção</div><div><b>02</b><br>Torra</div><div><b>03</b><br>Moagem</div><div><b>04</b><br>Preparo</div></div></div></div></div>`;document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{weight=Number(b.dataset.w);render()});document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grinding=Number(b.dataset.g);render()});document.querySelector('#buy')?.addEventListener('click',()=>{cc.addCart({variant_id:variant.id,product_id:p.id,name:p.name,variant_label:`${weight}g · ${variant.grinding_name}`,price:Number(variant.price),quantity:1,image:p.image_url});});document.querySelector('#notify')?.addEventListener('click',async()=>{const email=prompt('Qual e-mail devemos avisar?');if(email){await cc.api('/products/'+p.id+'/notify',{method:'POST',body:JSON.stringify({email})});cc.toast('Avisaremos quando voltar ao estoque.')}})}render()})().catch(e=>{app.innerHTML='<div class="notice">'+cc.esc(e.message)+'</div>'});</script></body></html>
