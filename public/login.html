<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><main class="section"><div class="container" style="max-width:520px"><a class="brand" href="index.html">Caffè Camillo<small>Colombi</small></a><div class="card form-card" style="margin-top:25px"><div class="kicker">Benvenuto</div><h1 style="font:700 45px var(--serif)">Entrar</h1><form id="login"><label>E-mail<input class="input" name="email" type="email" required></label><br><label>Senha<input class="input" name="password" type="password" required></label><br><button class="btn btn-primary" style="width:100%">Entrar</button></form><hr style="margin:25px 0"><h2>Primeiro café?</h2><form id="register"><label>Nome<input class="input" name="name" required></label><br><label>E-mail<input class="input" name="email" type="email" required></label><br><label>Telefone<input class="input" name="phone"></label><br><label>Senha<input class="input" name="password" type="password" minlength="8" required></label><br><button class="btn btn-secondary" style="width:100%">Criar conta</button></form></div></div></main><div class="toast" id="toast"></div><script src="js/app.js"></script><script>login.onsubmit=async e=>{e.preventDefault();const f=new FormData(login);try{const d=await cc.api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});localStorage.setItem('cc_token',d.token);localStorage.setItem('cc_user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'admin/index.html':'conta.html'}catch(e){cc.toast(e.message)}};register.onsubmit=async e=>{e.preventDefault();const f=new FormData(register);try{const d=await cc.api('/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});localStorage.setItem('cc_token',d.token);localStorage.setItem('cc_user',JSON.stringify(d.user));location.href='conta.html'}catch(e){cc.toast(e.message)}};</script></body></html>
