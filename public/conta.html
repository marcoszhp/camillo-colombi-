<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta | Caffè Camillo Colombi</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Caffè Camillo<small>Colombi</small></a><nav class="nav-links"><a href="produtos.html">Cafés</a><a href="clube.html">Clube</a></nav><button class="btn btn-secondary" data-logout>Sair</button></div></header><main class="section"><div class="container"><div class="kicker">La mia tavola</div><h1 style="font:700 56px var(--serif)">Minha conta.</h1><div id="profile" class="card form-card"></div><h2 style="font:700 38px var(--serif);margin-top:35px">Meus pedidos</h2><div id="orders"></div></div></main><div class="toast" id="toast"></div><script src="js/app.js"></script><script>(async()=>{if(!state.token)return location.href='login.html';try{const u=await cc.api('/auth/me');profile.innerHTML=`<h2>${cc.esc(u.name)}</h2><p>${cc.esc(u.email)} · ${cc.esc(u.phone||'')}</p><a class="btn btn-primary" href="clube.html">Ver meu Camillo Club</a>`;const os=await cc.api('/orders/mine');orders.innerHTML=os.length?os.map(o=>`<article class="card form-card" style="margin:12px 0"><div class="section-head"><div><strong>Pedido #${o.id}</strong><p class="muted">${new Date(o.created_at).toLocaleString('pt-BR')}</p></div><span class="pill">${o.status}</span></div><div class="timeline">${['received','payment_confirmed','preparing','shipped','delivered'].map((s,i)=>`<div class="step ${['received','payment_confirmed','preparing','shipped','delivered'].indexOf(o.status)>=i?'done':''}">${['Pedido recebido','Pagamento confirmado','Em preparação','Enviado','Entregue'][i]}</div>`).join('')}</div><p>${o.items.map(i=>`${i.quantity}× ${cc.esc(i.product_name)} — ${cc.money(i.subtotal)}`).join('<br>')}</p><strong>${cc.money(o.total)}</strong></article>`).join(''):'<div class="empty">Você ainda não fez pedidos.</div>'}catch(e){orders.innerHTML='<div class="notice">'+cc.esc(e.message)+'</div>'}})();</script></body></html>
