<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Caffè Camillo Colombi</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-shell"><aside class="admin-side"><a class="brand" href="../index.html" style="color:#fff">Caffè Camillo<small style="color:var(--yellow)">Colombi · admin</small></a><a href="#dashboard">Dashboard</a><a href="#products">Produtos</a><a href="#orders">Pedidos</a><a href="../index.html">← Site</a><button class="btn btn-secondary" data-logout>Sair</button></aside><main class="admin-main"><div class="section-head"><div><div class="kicker">Back office</div><h1 style="font:700 45px var(--serif);margin:0">Painel</h1></div></div><section id="dashboard"><div class="stats" id="stats"></div><div class="card form-card"><h2>Mais vendidos</h2><div class="table-wrap"><table class="table"><tbody id="top"></tbody></table></div></div></section><section class="section" id="products"><div class="section-head"><h2>Produtos</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Tipo</th><th>Origem</th><th>Estoque</th><th>Preço base</th></tr></thead><tbody id="pt"></tbody></table></div></section><section class="section" id="orders"><div class="section-head"><h2>Pedidos</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ação</th></tr></thead><tbody id="ot"></tbody></table></div></section></main></div><div class="toast" id="toast"></div><script src="../js/app.js"></script><script>if(!state.token||!state.user||state.user.role!=='admin')location.href='../login.html';async function load(){const d=await cc.api('/orders/dashboard');stats.innerHTML=`<div class="stat"><span>Pedidos</span><strong>${d.orders_count}</strong></div><div class="stat"><span>Faturamento</span><strong>${cc.money(d.revenue)}</strong></div><div class="stat"><span>Clientes</span><strong>${d.customers_count}</strong></div><div class="stat"><span>Estoque baixo</span><strong>${d.low_stock}</strong></div>`;top.innerHTML=d.top_products.map(x=>`<tr><td>${cc.esc(x.product_name)}</td><td>${x.quantity}</td></tr>`).join('');const ps=await cc.api('/admin/products');pt.innerHTML=ps.map(p=>`<tr><td>${cc.esc(p.name)}</td><td>${p.bean_type}</td><td>${cc.esc(p.origin_name)}</td><td>${p.stock}</td><td>${cc.money(p.base_price)}</td></tr>`).join('');const os=await cc.api('/orders');ot.innerHTML=os.map(o=>`<tr><td>#${o.id}</td><td>${cc.esc(o.customer_name)}</td><td>${cc.money(o.total)}</td><td>${o.payment_status}</td><td>${o.status}</td><td><select onchange="changeStatus(${o.id},this.value)"><option value="received">Recebido</option><option value="payment_confirmed">Pagamento confirmado</option><option value="preparing">Em preparação</option><option value="shipped">Enviado</option><option value="delivered">Entregue</option><option value="cancelled">Cancelado</option></select></td></tr>`).join('')}async function changeStatus(id,v){try{await cc.api('/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:v})});cc.toast('Status atualizado')}catch(e){cc.toast(e.message)}}load().catch(e=>cc.toast(e.message));</script></body></html>
