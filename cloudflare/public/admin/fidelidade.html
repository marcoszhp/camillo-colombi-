-top:.8rem">Adicionar nível</button></form><h2 style="font-size:1.7rem;margin-top:2rem">Recompensas</h2><div id="rewardsAdmin" class="grid grid-3"></div><form id="rewardForm" class="card" style="padding:1rem;margin-top:1rem"><h3>Nova recompensa</h3><div class="form-grid two"><div class="field"><label>Nome</label><input class="input" name="name" required></div><div class="field"><label>Custo em pontos</label><input class="input" name="points_cost" type="number" min="1" required></div><div class="field"><label>Tipo</label><select class="select" name="reward_type"><option value="discount">Desconto</option><option value="shipping">Frete</option><option value="gift">Brinde</option><option value="sample">Amostra</option><option value="early_access">Acesso antecipado</option><option value="coffee_machine_future">Cafeteira futura</option></select></div><div class="field"><label>Descrição</label><input class="input" name="description" required></div></div><button class="btn btn-secondary" style="margin-top:.8rem">Adicionar recompensa</button></form></main></div><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script><script src="/js/ui.js"></script><script src="/js/products.js"></script><script src="/js/pages/main.js"></script></body></html>
