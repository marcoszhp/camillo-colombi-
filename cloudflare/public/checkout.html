<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Caffè Camillo Colombi — café artesanal, familiar e capixaba com inspiração italiana."><title>Checkout · Caffè Camillo Colombi</title><link rel="icon" href="/assets/logo/logo-mark.svg"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/pages.css"><link rel="stylesheet" href="/css/editorial.css"></head><body data-page="checkout"><div data-header></div><main id="conteudo"><section class="section"><div class="container"><span class="eyebrow">Finalização</span><h1 style="font-size:3rem">Checkout</h1><div class="checkout-grid"><form id="checkoutForm" class="card" style="padding:1.25rem"><h3>Entrega</h3><div class="form-grid two"><div class="field"><label for="checkout-name">Nome</label><input id="checkout-name" class="input" name="name" required></div><div class="field"><label for="checkout-email">E-mail</label><input id="checkout-email" class="input" name="email" type="email" required></div><div class="field"><label for="checkout-phone">Telefone</label><input id="checkout-phone" class="input" name="phone" required></div><div class="field"><label for="checkout-zip-code">CEP</label><input id="checkout-zip-code" class="input" name="zipCode" required></div><div class="field"><label for="checkout-street">Rua</label><input id="checkout-street" class="input" name="street" required></div><div class="field"><label for="checkout-number">Número</label><input id="checkout-number" class="input" name="number" required></div><div class="field"><label for="checkout-complement">Complemento</label><input id="checkout-complement" class="input" name="complement"></div><div class="field"><label for="checkout-district">Bairro</label><input id="checkout-district" class="input" name="district" required></div><div class="field"><label for="checkout-city">Cidade</label><input id="checkout-city" class="input" name="city" required></div><div class="field"><label for="checkout-state">Estado (UF)</label><input id="checkout-state" class="input" name="state" maxlength="2" required></div></div><h3 style="margin-top:1.5rem">Pagamento de demonstração</h3><div class="form-grid two"><div class="field"><label for="checkout-payment-method">Forma</label><select id="checkout-payment-method" class="select" name="paymentMethod"><option value="pix">PIX</option><option value="card">Cartão (Visa/Mastercard/Elo/Hipercard)</option></select></div><div class="field"><label for="checkout-card-brand">Bandeira (cartão)</label><select id="checkout-card-brand" class="select" name="cardBrand"><option value="visa">Visa</option><option value="mastercard">Mastercard</option><option value="elo">Elo</option><option value="hipercard">Hipercard</option></select></div><div class="field"><label for="checkout-payment-scenario">Cenário do mock</label><select id="checkout-payment-scenario" class="select" name="paymentScenario"><option value="approved">Aprovado</option><option value="pending">Pendente</option><option value="declined">Recusado</option><option value="canceled">Cancelado</option></select></div></div><div class="notice notice-warning" style="margin-top:1rem">Este checkout não processa dinheiro real e não coleta número completo de cartão ou CVV.</div><div class="field" style="margin-top:1rem"><label for="checkout-notes">Observações</label><textarea id="checkout-notes" class="textarea" name="notes"></textarea></div><p id="checkoutError" style="color:var(--danger)"></p><button id="placeOrder" class="btn btn-primary" type="submit">Confirmar pedido</button></form><aside id="checkoutItems" class="card order-summary"></aside></div></div></section></main><div data-footer></div><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/cart.js"></script><script src="/js/ui.js"></script><script src="/js/products.js"></script><script src="/js/pages/main.js"></script></body></html>
